title: Java4Shell - multiple JVM crash logs on one host
id: 5b1f8a44-2d67-4c39-a1e8-9d3b6f7c2e03
status: experimental
description: >
  Correlation rule: several JVM fatal error logs on the same host within 15 minutes, consistent with
  repeated Java4Shell (CVE-2026-114938) attempts that each crash the JVM. Failed exploitation attempts
  are expected to crash the process. A single crash is not evidence; a burst on an internet-facing
  Java service warrants triage.
references:
  - https://calif.io/java4shell
  - https://www.cisa.gov/news-events/alerts/2026/11/17/critical-java-vulnerability-requires-immediate-patching
author: f4n6
date: 2026/11/18
tags:
  - attack.impact
  - attack.t1499
correlation:
  type: event_count
  rules:
    - java4shell_jvm_crash_files
  group-by:
    - Computer
  timespan: 15m
  condition:
    gte: 3
falsepositives:
  - Application memory pressure or unrelated JVM faults causing repeated crashes
level: high
